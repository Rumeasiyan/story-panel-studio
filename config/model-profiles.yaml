  sdxl-lightning:
    description: SDXL Lightning step-distillation LoRAs (2 and 4 step)
    engine: comfyui
    workflow_family: sdxl
    notes: >-
      Cuts SDXL sampling from 25 steps to 4 (or 2), roughly 3-5x faster per panel, at
      some cost in fine detail. Apply through the `lora` parameter on any SDXL pipeline
      and drop `steps` to match; use cfg 1-2 and a simple sampler (euler, sgm_uniform).
      Works with any SDXL checkpoint here, including NoobAI and Illustrious.
