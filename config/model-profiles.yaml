# Model registry for ai-video-gen.
#
# Manifest-driven: new profiles are added here, not by restructuring the repository.
# Every artifact pins an exact Hugging Face revision (commit SHA), never floating `main`.
#
# Metadata below was resolved from the Hugging Face API on 2026-08-01.
#
# Schema
#   profiles:
#     <profile-id>:
#       description: str
#       engine: comfyui
#       workflow_family: str          # informational grouping for workflows/
#       notes: str                    # optional, VRAM/usage guidance
#       artifacts:
#         - id: str                   # stable local identifier
#           repository: str           # Hugging Face repo id
#           revision: str             # pinned commit SHA
#           filename: str             # path inside the repo
#           destination: str          # project-root-relative directory
#           local_filename: str       # optional rename on disk
#           size_bytes: int           # expected size, used by verify
#           sha256: str               # LFS sha256, used by `modelctl verify --hash`
#           licence: str
#           licence_url: str
#           commercial_review_required: bool

profiles:

