# Locked narration defaults.
#
# Chosen by listening, not by specification. Any agent generating narration uses the
# entry for the language and changes nothing unless the request explicitly asks for
# something else. Do not substitute an engine because it looks newer, faster, or more
# capable on paper — every alternative here was already generated and rejected by ear.
#
# Anchors are gitignored (renders). Rebuild recipes: assets/voices/README.md,
# assets/voices/locked/README.md.

english:
  pipeline: tts-chatterbox
  anchor: assets/voices/locked/en.wav
  anchor_note: >-
    8s trim of output/voice-samples-chatterbox/en-calm-authoritative.wav, NO formant
    shift. Not reel-narrator-v1.wav, which is the +4% variant and a different voice.
  register: casual spoken English — contractions, fragments, discourse markers
  emotion: per-beat, via exaggeration and cfg_weight
  reference_output: output/voice-lock/00-english-emotive-locked.wav
  beat_presets:            # starting points; tune per script
    calm:       {exaggeration: 0.30, cfg_weight: 0.30}
    reflective: {exaggeration: 0.35, cfg_weight: 0.32}
    tension:    {exaggeration: 0.55, cfg_weight: 0.40}
    peak:       {exaggeration: 0.95, cfg_weight: 0.45}
    flat:       {exaggeration: 0.30, cfg_weight: 0.28}
    low:        {exaggeration: 0.25, cfg_weight: 0.25}
    resolve:    {exaggeration: 0.75, cfg_weight: 0.42}

tamil:
  pipeline: tts-omnivoice
  language: Tamil
  anchor: assets/voices/locked/a01-auto.wav
  reference_text_from: assets/voices/locked/README.md
  register: >-
    Tamil Nadu spoken Tamil, NOT literary. வந்துட்டாரு not வந்தான்; -ங்க plurals;
    dropped final vowels (இல்ல); English loanwords are normal (ஆபீஸ், கார்டு, பேஜ்).
  emotion: none available — vary speed only (0.88 heavy, 1.00 neutral, 1.12 lift)
  reference_output: output/voice-lock/02-tamil-omnivoice-a01.wav

sinhala:
  pipeline: tts-omnivoice
  language: Sinhala
  anchor: assets/voices/locked/a01-auto.wav      # same speaker as Tamil, by design
  reference_text_from: assets/voices/locked/README.md
  register: >-
    Spoken Sinhala, NOT written. එයාට ඔක්කොම නැති වුණා, not ඔහු සියල්ල අහිමි කරගෙන
    සිටියේය. Written Sinhala conjugates verbs for person and number; spoken does not.
  emotion: none available — vary speed only
  reference_output: output/voice-lock/03-sinhala-omnivoice-a01.wav
  caveat: >-
    OmniVoice has 12h of Sinhala training data against 423h of Tamil. Accepted by ear
    anyway, but it is the most fragile of the three — re-listen before scaling volume.

rejected:
  - engine: Indic Parler-TTS
    for: English
    why: Indic research model; does not sound publishable. Still registered for Indic use.
  - engine: IndicF5
    for: all
    why: will not load on this stack — see issue #2
  - engine: omnivoice-studio
    for: all
    why: FSL-1.1-ALv2 forbids commercial use for two years. The k2-fsa MODEL is
         Apache-2.0 and is what we use; the GUI wrapper is a different project.
  - approach: formant-shifting an anchor to change perceived age
    why: shifts timbre but not identity — still the same speaker. Rejected by ear at
         +8% and +12%.

open:
  - >-
    Every anchor is derived from a synthetic stock speaker, not a person. One real
    recording would replace all three at once, since cloning is cross-lingual. Issue #7.
