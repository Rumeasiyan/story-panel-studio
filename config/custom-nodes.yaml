# Custom node registry for story-panel-studio.
#
# EMPTY BY DESIGN. The core setup must work with zero third-party nodes.
#
# Rules (see CLAUDE.md):
#   - Add nodes ONE AT A TIME, each pinned to an exact Git commit.
#   - Never bulk-install unknown node packs.
#   - Before adding an entry, inspect: maintenance status, licence, install
#     instructions, and whether its dependencies would replace torch/CUDA packages.
#   - `custom-nodectl install` backs up requirements.lock.txt and refuses silently
#     replacing torch, torchvision, torchaudio, or nvidia-* packages.
#   - Nodes are installed as Git submodules under the project-root custom_nodes/,
#     which ComfyUI sees via config/extra_model_paths.yaml.
#
# Schema
#   nodes:
#     <id>:
#       repository: https://github.com/owner/name.git
#       commit: <full 40-character SHA>       # never a branch name
#       description: str
#       licence: str
#       requirements: true | false            # has its own requirements.txt
#       notes: str
#
# Example (commented out — do not install without explicit approval):
#
# nodes:
#   comfyui-ipadapter-plus:
#     repository: https://github.com/cubiq/ComfyUI_IPAdapter_plus.git
#     commit: 0000000000000000000000000000000000000000
#     description: IP-Adapter nodes for character consistency
#     licence: VERIFY_FROM_REPOSITORY
#     requirements: true
#     notes: Needs models under models/ipadapter and models/clip_vision.

nodes: {}
