# Third-party ComfyUI nodes. Pinned by commit, added one at a time — a node pack can
# replace torch or CUDA packages and break the image engine.
#
# After installing any of these, check `transformers` and `torch` still match what
# ComfyUI needs (see AGENTS.md).

nodes:
  comfyui-gguf:
    description: >-
      Loads GGUF-quantised UNets. Needed for Qwen-Image-Edit: the model is 20B and only
      fits this machine as a quant streamed from system RAM.
    repository: https://github.com/city96/ComfyUI-GGUF
    commit: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a
    licence: Apache-2.0
