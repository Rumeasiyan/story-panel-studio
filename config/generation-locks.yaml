# Locked generation defaults — images, video, narration.
#
# Chosen by generating candidates and judging the output, not by reading capability
# claims. Any agent generating an asset uses the entry for the job and changes nothing
# unless the request explicitly asks for something else. Do not substitute a model
# because it looks newer, faster, or broader on paper: the alternatives listed under
# `rejected` were each generated and then ruled out.
#
# Reference output for every locked choice is in output/compare/ and output/voice-lock/.

image:
  anime_panels:
    pipeline: sdxl-text-to-image
    model: anime                    # Illustrious-XL v2.0
    prompting: booru tags — "1boy, solo, black suit, rain, night, neon"
    why: renders rain and weather the others dropped; RAIL-M licence; LoRA training base
  cinematic_panels:
    pipeline: sdxl-text-to-image
    model: cinematic                # RealVisXL V4.0
    prompting: prose
  character_consistency:
    method: LoRA trained locally with ./scripts/train-lora
    base: illustrious               # kai.safetensors verified working on this base
    lora_strength: 1.15
    why: >-
      The pipeline default of 0.85 is too low for this LoRA. On seed 33 at 0.85 and at
      1.00 the character came out blond with only a faint scar; at 1.15 the black hair,
      yellow eyes and scar all returned. Untested: whether 1.15 costs prompt
      flexibility for pose and expression, which is the usual trade for a stronger LoRA.
  fast_drafts:
    lora: sdxl_lightning_4step_lora.safetensors
    settings: {steps: 4, cfg: 1.5, sampler: euler, scheduler: sgm_uniform}
    use_for: candidate batches only — at batch 1 it is 24s -> 15s for real quality loss
  establishing_shots:
    pipeline: flux2-text-to-image     # FLUX.2 klein 4B
    use_for: cinematic shots with NO recurring character
    why: >-
      Better and faster than RealVis on the same prompt (18s vs 24s) and Apache-2.0.
      Not for character work — this pipeline has no LoRA support, and character
      consistency runs on LoRAs, which need SDXL.
  editing:
    pipeline: flux2-edit              # FLUX.2 klein 4B
    verified: >-
      Wardrobe swap held face, pose, background and rain exactly
      (output/compare/edit-2-clothing.png); night-to-day held the character
      (edit-1-daytime.png).

video:
  status: out of scope
  why: >-
    Product is still-panel story videos with narration. Generation time did not justify
    the result. No Wan weights installed; do not download them. Motion belongs to the
    orchestrator (pan/zoom over panels), not to this repo.

voice:
  # anchors are gitignored renders; rebuild: assets/voices/locked/README.md
  english:
    pipeline: tts-chatterbox
    anchor: assets/voices/locked/en.wav
    anchor_note: >-
      8s trim of output/voice-samples-chatterbox/en-calm-authoritative.wav, NO formant
      shift. Not reel-narrator-v1.wav, which is the +4% variant and a different voice.
    register: casual spoken English — contractions, fragments, discourse markers
    emotion: per-beat, via exaggeration and cfg_weight
    reference_output: output/voice-lock/00-english-emotive-locked.wav
    beat_presets:            # starting points; tune per script
      calm:       {exaggeration: 0.30, cfg_weight: 0.30}
      reflective: {exaggeration: 0.35, cfg_weight: 0.32}
      tension:    {exaggeration: 0.55, cfg_weight: 0.40}
      peak:       {exaggeration: 0.95, cfg_weight: 0.45}
      flat:       {exaggeration: 0.30, cfg_weight: 0.28}
      low:        {exaggeration: 0.25, cfg_weight: 0.25}
      resolve:    {exaggeration: 0.75, cfg_weight: 0.42}

  tamil:
    pipeline: tts-omnivoice
    language: Tamil
    anchor: assets/voices/locked/a01-auto.wav
    reference_text_from: assets/voices/locked/README.md
    register: >-
      Tamil Nadu spoken Tamil, NOT literary. வந்துட்டாரு not வந்தான்; -ங்க plurals;
      dropped final vowels (இல்ல); English loanwords are normal (ஆபீஸ், கார்டு, பேஜ்).
    emotion: none available — vary speed only (0.88 heavy, 1.00 neutral, 1.12 lift)
    reference_output: output/voice-lock/02-tamil-omnivoice-a01.wav

  sinhala:
    pipeline: tts-omnivoice
    language: Sinhala
    anchor: assets/voices/locked/a01-auto.wav      # same speaker as Tamil, by design
    reference_text_from: assets/voices/locked/README.md
    register: >-
      Spoken Sinhala, NOT written. එයාට ඔක්කොම නැති වුණා, not ඔහු සියල්ල අහිමි කරගෙන
      සිටියේය. Written Sinhala conjugates verbs for person and number; spoken does not.
    emotion: none available — vary speed only
    reference_output: output/voice-lock/03-sinhala-omnivoice-a01.wav
    caveat: >-
      OmniVoice has 12h of Sinhala training data against 423h of Tamil. Accepted by ear
      anyway, but it is the most fragile of the three — re-listen before scaling volume.

  rejected:
    - engine: Indic Parler-TTS
      for: English
      why: Indic research model; does not sound publishable. Still registered for Indic use.
    - engine: IndicF5
      for: all
      why: will not load on this stack — see issue #2
    - engine: omnivoice-studio
      for: all
      why: FSL-1.1-ALv2 forbids commercial use for two years. The k2-fsa MODEL is
           Apache-2.0 and is what we use; the GUI wrapper is a different project.
    - approach: formant-shifting an anchor to change perceived age
      why: shifts timbre but not identity — still the same speaker. Rejected by ear at
           +8% and +12%.

  open:
    - >-
      Every anchor is derived from a synthetic stock speaker, not a person. One real
      recording would replace all three at once, since cloning is cross-lingual. Issue #7.
