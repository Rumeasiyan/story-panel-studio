<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ai-video-gen — generation console</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎬</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🎬</span>
    <div>
      <h1>ai-video-gen</h1>
      <p class="sub">generation console &middot; local &middot; <a href="/docs">API docs</a></p>
    </div>
  </div>
  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">checking…</span>
  </div>
</header>

<main>
  <!-- ------------------------------------------------------------ compose -->
  <section class="panel compose">
    <h2>Generate</h2>

    <label class="field">
      <span>Capability</span>
      <select id="pipeline"></select>
      <small class="hint" id="pipelineNote"></small>
    </label>

    <!-- Built from the selected pipeline's declared parameters. -->
    <div id="fields"></div>

    <button id="generate" class="primary">Queue job</button>
    <p id="formError" class="error" hidden></p>
    <p class="hint tip">This console is a thin client over the same REST API your other
       app uses. Everything here is available at <a href="/docs">/docs</a>.</p>
  </section>

  <!-- ------------------------------------------------------------ library -->
  <section class="panel library">
    <div class="library-head">
      <h2>Jobs <span id="jobCount" class="count"></span></h2>
      <label class="toggle">
        <select id="kindFilter">
          <option value="">all kinds</option>
          <option value="image">image</option>
          <option value="video">video</option>
          <option value="audio">audio</option>
          <option value="subtitle">subtitle</option>
        </select>
      </label>
    </div>
    <div id="active"></div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>Nothing generated yet.</p>
  </section>
</main>

<!-- -------------------------------------------------------------- viewer -->
<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-body">
    <button class="modal-close" data-close aria-label="Close">✕</button>
    <div class="player-wrap" id="viewer"></div>
    <div class="modal-meta">
      <div class="modal-actions">
        <button id="btnFullscreen">⛶ Fullscreen</button>
        <a id="btnDownload" class="button" download>⬇ Download</a>
        <button id="btnReuse">↻ Reuse settings</button>
        <button id="btnDelete" class="danger">🗑 Delete</button>
      </div>
      <dl id="modalParams" class="params"></dl>
      <pre class="modal-prompt" id="modalPrompt"></pre>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
